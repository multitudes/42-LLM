[project]
name = "llm-sdk"
version = "0.1.0"
description = "LLM SDK for local model inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = [
    "^llm_sdk/",
]

# Ignore type checking errors inside the external/vendor llm_sdk package
[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true
ignore_missing_imports = true

# Disable missing import warnings for third-party libraries without stub files
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "huggingface_hub.*",
]
ignore_missing_imports = true
